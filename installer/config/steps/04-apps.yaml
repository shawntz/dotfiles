    app: Cursor.app
  - cask: daisydisk
    app: DaisyDisk.app
    note: paid; needs your license
  - cask: docker-desktop
    app: Docker.app
  - cask: firefox
    app: Firefox.app
  - cask: framer
    app: Framer.app
  - cask: github
    app: GitHub Desktop.app
