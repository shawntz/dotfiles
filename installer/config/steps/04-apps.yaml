# Apps: everything on the old laptop that was not installed with Homebrew, plus
# what was added since.
#
# Each cask names its app with `app:`, so a copy already in /Applications
# (installed by hand or by an IT department) counts as done instead of being
# installed twice. Add an app like this, checking the token and the app name
# with `brew info --cask <token>` first:
#
#   - cask: notion
#     app: Notion.app
#
# `optional: true` leaves an item unchecked until you switch it on in
# Customize. App Store apps (`mas:`) need the App Store id and the app's exact
# name, and you must be signed in to the App Store; the installer asks once.
# Keep each group in alphabetical order.

id: apps
title: Apps
subtitle: Casks, App Store apps and a direct download
mascot: bubblegum

items:
  # ── Casks ──────────────────────────────────────────────────────────────
  - cask: 1password
    app: 1Password.app
  - cask: balenaetcher
    app: balenaEtcher.app
