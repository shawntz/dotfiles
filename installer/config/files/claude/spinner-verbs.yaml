# Claude Code spinner phrases.
#
# Each line under `verbs:` is one phrase Claude Code shows next to its spinner
# while it thinks. To add one, add a line in the same form, quoted:
#
#     - "Rummaging (through the codebase)"
#
# To drop one, delete its line. `mode: replace` means only these phrases are
# shown; `mode: append` would mix them with the built-in ones.
# steps/12-claude.yaml writes this list into ~/.claude/settings.json,
# replacing the list that is there.

spinnerVerbs:
  mode: replace
  verbs:
    - "abeyance (n.) a state of temporary suspension"
    - "alacrity (n.) brisk and cheerful readiness"
    - "anodyne (adj.) inoffensive; soothing"
    - "approbation (n.) approval or praise"
    - "asperity (n.) harshness of tone or manner"
    - "bombastic (adj.) high-sounding but with little meaning"
    - "burgeon (v.) to grow or expand rapidly"
    - "cajole (v.) to persuade by flattery or coaxing"
    - "calumny (n.) a false and slanderous statement"
    - "capricious (adj.) given to sudden changes of mood"
    - "chicanery (n.) the use of trickery to deceive"
    - "diffident (adj.) modest or shy from lack of confidence"
    - "dilatory (adj.) slow to act; tending to delay"
    - "ebullient (adj.) cheerful and full of energy"
    - "enervate (v.) to weaken or drain of energy"
    - "ephemeral (adj.) lasting for a very short time"
    - "equivocate (v.) to use ambiguous language to deceive"
    - "fastidious (adj.) very attentive to detail; fussy"
    - "garrulous (adj.) excessively talkative"
    - "iconoclast (n.) one who attacks cherished beliefs"
    - "inchoate (adj.) just begun; not fully formed"
    - "ineluctable (adj.) unable to be avoided or resisted"
    - "intransigent (adj.) unwilling to compromise"
    - "laconic (adj.) using very few words"
    - "mendacious (adj.) given to lying; untruthful"
    - "obdurate (adj.) stubbornly refusing to change"
    - "obsequious (adj.) excessively obedient or flattering"
    - "perfunctory (adj.) done with minimal effort or care"
    - "pellucid (adj.) transparently clear in style or meaning"
    - "phlegmatic (adj.) calm and unemotional"
    - "prevaricate (v.) to speak evasively; to stray from truth"
    - "pulchritude (n.) physical beauty"
    - "quotidian (adj.) ordinary; occurring every day"
    - "recondite (adj.) obscure; little known"
    - "sanguine (adj.) optimistic, especially in a bad situation"
    - "sycophant (n.) a self-seeking flatterer"
    - "taciturn (adj.) reserved; saying little"
    - "truculent (adj.) eager to argue or fight"
    - "turpitude (n.) depraved or wicked behavior"
    - "vituperate (v.) to blame or insult in harsh language"
    - "abstruse (adj.) difficult to understand; esoteric"
    - "alacritous (adj.) marked by brisk eagerness"
    - "ameliorate (v.) to make better; to improve"
    - "ascetic (adj.) practicing severe self-discipline"
    - "aspersion (n.) a damaging or disparaging remark"
    - "assuage (v.) to soothe or relieve"
    - "bucolic (adj.) relating to pleasant rural life"
    - "cogent (adj.) clear, logical, and convincing"
    - "deleterious (adj.) causing harm or damage"
    - "desultory (adj.) lacking a plan or purpose; random"
    - "diaphanous (adj.) light, delicate, and translucent"
    - "didactic (adj.) intended to teach or moralize"
    - "ersatz (adj.) an inferior imitation or substitute"
    - "fulsome (adj.) excessive and insincere, esp. praise"
    - "germane (adj.) relevant to the matter at hand"
    - "harangue (n.) a lengthy and aggressive speech"
    - "imperturbable (adj.) unable to be upset; calm"
    - "inveigle (v.) to win over by flattery or deceit"
    - "lugubrious (adj.) mournful, esp. to an exaggerated degree"
    - "munificent (adj.) very generous"
    - "nascent (adj.) just coming into existence"
    - "nefarious (adj.) wicked or criminal"
    - "obfuscate (v.) to render obscure or unclear"
    - "ossify (v.) to harden or become rigidly fixed"
    - "pernicious (adj.) having a subtle but harmful effect"
    - "perspicacious (adj.) having keen insight; shrewd"
    - "propitious (adj.) giving favorable conditions"
    - "puerile (adj.) childishly silly and immature"
    - "remonstrate (v.) to protest or object forcefully"
    - "salubrious (adj.) health-giving; wholesome"
    - "spurious (adj.) false or fake; not genuine"
    - "supercilious (adj.) haughtily disdainful"
    - "trenchant (adj.) vigorous and incisive in expression"
    - "ubiquitous (adj.) present everywhere at once"
    - "venal (adj.) open to bribery; corruptible"
    - "Second-breakfasting (eating again, hobbit-style)"
    - "Silly-walking (proceeding with absurd gait)"
    - "Great-scotting (exclaiming in flux-capacitor awe)"
    - "Bamboozling (snookering, mildly)"
    - "Flux-capacitating (making time travel possible)"
    - "Hyperventilating (politely)"
    - "Vibe-checking (the codebase)"
    - "Reticulating splines (as one does)"
    - "Procrasti-working (busy not-finishing)"
    - "Wibbly-wobbling (timey-wimey-ing)"
    - "Nyooming (at considerable speed)"
